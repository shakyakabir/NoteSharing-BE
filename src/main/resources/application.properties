# ---- AI credits & subscription (all overridable; defaults live in AiCreditPolicy) ----
# Per-feature credit costs
ai.cost.summarize=1
ai.cost.key-points=1
ai.cost.report=3
ai.cost.quiz=2
ai.cost.ppt=4
ai.cost.qa=1
# Free plan: allowance + refresh cadence (days)
ai.plan.free.credits=20
ai.plan.free.refresh-days=21
# Premium plan: allowance + refresh cadence (days)
ai.plan.premium.credits=100
ai.plan.premium.refresh-days=7
# Premium unlock: price in existing points + how long it lasts (days)
ai.premium.price-points=500
ai.premium.duration-days=30
# Admin access: comma-separated emails promoted to ROLE_ADMIN on startup (DataSeeder). Empty = none.
app.admin.emails=