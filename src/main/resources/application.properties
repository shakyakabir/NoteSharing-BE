spring.application.name=noteSharing


spring.datasource.url=jdbc:mysql://localhost:3306/notesharing
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT-ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT-SECRET}
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
unsplash.access-key=${UNSPLASH_ACCESS_KEY}

jwt.secret=${SECRET_KEY}
jwt.access.expiration=${ACCESS_TOKEN}
jwt.refresh.expiration=${REFRESH_TOKEN}

